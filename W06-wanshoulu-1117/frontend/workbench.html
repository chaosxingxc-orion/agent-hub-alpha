    + '<div class="pass-note">数值核验 PASSED · v' + esc(n.data.checker_version) + "（仅改该句口径，其余零改动）</div>"
    + '<div class="pass-note">引用核验 PASSED · v' + esc(c.data.checker_version) + "</div>");
}
async function demoStep4() {
  const r = await jpost("/v1/approvals?approver=" + encodeURIComponent("Alice"), state.artifact);
  if (!r.ok) {
    setStep(4, "blocked", "失败", '<div class="refused-card">HTTP ' + r.status + "：" + esc((r.data || {}).message || "") + "</div>");
    return;
  }
  state.approval = r.data;
  setStep(4, "done", "已批准",
    '<div class="approval-card"><b style="color:var(--success)">交付批准已签发</b><div class="a-grid">'
    + '<span><b>批准编号</b><span class="mono">' + esc(r.data.approval_id) + "</span></span>"
    + "<span><b>批准人</b>" + esc(r.data.approver) + "</span>"
    + '<span><b>批准时间</b><span class="mono">' + esc(r.data.approved_at) + "</span></span>"
    + "<span><b>数值核验</b>PASSED · " + esc(r.data.checks.numeric.checker_version) + "</span>"
    + "<span><b>引用核验</b>PASSED · " + esc(r.data.checks.citation.checker_version) + "</span>"
    + '<span><b>工件指纹</b><span class="digest">' + esc(r.data.artifact_digest) + "</span></span></div></div>");
}
async function demoStep5() {
  const a = state.artifact;
  const pv = a.metrics.find(m => m.key === "PROVISION_COVERAGE");
  pv.value = "391.99";
  s2body(a).body = s2body(a).body.replace("拨备覆盖率391.79%", "拨备覆盖率391.99%");
  const dg = await jpost("/v1/artifacts/digest", a);
  const n = await jpost("/v1/checks/numeric", a);
  const ap = await jpost("/v1/approvals?approver=" + encodeURIComponent("Alice"), a);
  setStep(5, "refused", "篡改无效",
    '<div class="diff-banner"><div>'
    + "批准记录绑定的工件指纹 ≠ 篡改稿指纹，既有批准立即失效：<br>"
    + '批准时指纹 <span class="digest">' + esc(state.approval ? state.approval.artifact_digest : "—") + "</span><br>"
    + '篡改稿指纹 <span class="digest">' + esc(dg.data.artifact_digest) + "</div></div>"
    + vioRows(n.data.violations)
    + (ap.ok
      ? ""
      : '<div class="refused-card">POST /v1/approvals → HTTP ' + ap.status + " "
      + esc((ap.data || {}).status || "") + "：" + esc((ap.data || {}).message || "") + "</div>"));
}
function demoStep6() {
  state.artifact = clone(state.positive);
  renderDemoShell();
  setStep(6, "done", "已重置", '<div class="pass-note">演示已重置：正例工件已载入，各步状态清零。</div>');
}

function renderDemoShell() {
  $("#view-demo").innerHTML =
    '<div style="margin-bottom:12px"><button class="btn sm" onclick="switchTab(\'assets\')">← 返回资产库</button></div>'
    + '<div class="card"><h3>演示链：从「口径错误拦截」到「篡改失效」 <span class="hint">六步 · 每步真实调用后端 API</span></h3>'
    + '<div style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-bottom:16px">'
    + "本演示链复现受控交付的关键能力：<b>错误被当场拦截</b> → <b>修订后双检通过</b> → <b>具名批准与内容指纹绑定</b> → <b>任何篡改使批准立即失效</b>。"
    + "请按编号顺序点击各步按钮。</div>"
    + '<div id="demo-steps"></div></div>';
  demoStep(1, "载入正例工件", "口径正确版本：拨备覆盖率较上年末下降 20.19 个百分点。", "载入正例", demoStep1);
  demoStep(2, "注入「%」口径草稿", "同一份年报把「个百分点」写成「%」——数值核验器应当场拦截。", "注入口径错误草稿", demoStep2);
  demoStep(3, "采纳修订并双检重跑", "把「%」改回「个百分点」，数值与引用核验重跑。", "修订为「个百分点」", demoStep3);
  demoStep(4, "具名批准交付", "批准记录绑定工件内容指纹（sha256），批准人 Alice。", "Alice 批准交付", demoStep4);
  demoStep(5, "篡改检测：改动指标再申请批准", "把拨备覆盖率 391.79% 篡改为 391.99%，既有批准应立即失效、新批准被拒绝。", "篡改指标后申请批准", demoStep5);
  demoStep(6, "重置演示", "恢复正例工件、清零步骤状态。", "重置演示", demoStep6);
}

/* ———————————————————— 初始化 ———————————————————— */
async function init() {
  try {
    const [health, manifest, positive, banks] = await Promise.all([
      jget("/health"), jget("/v1/snapshot/manifest"), jget("/demo/positive-artifact.json"), jget("/v1/banks")
    ]);
    state.health = health;
    state.manifest = manifest;
    state.positive = positive;
    state.artifact = clone(positive);
    state.citeArtifact = state.artifact;
    state.banks = Array.isArray(banks) ? banks : [];
    /* 各银行快照 manifest 并行装载（对话流按所选银行取指标索引/释义） */
    const mans = await Promise.all(state.banks.map(b =>
      jget("/v1/snapshot/manifest?bank=" + b.bank).then(m => [b.bank, m]).catch(() => [b.bank, manifest])));
    state.manifests = Object.fromEntries(mans);
    const hb = $("#health-badge");
    if (health.status === "ok") { hb.className = "badge success"; hb.textContent = "服务正常"; }
    else { hb.className = "badge warning"; hb.textContent = health.status || "状态未知"; }
    $("#health-ver").textContent = "vNumericChecker " + (health.numeric_checker_version || "?")
      + " · vCitationChecker " + (health.citation_checker_version || "?")
      + " · 银行快照 " + state.banks.length + " 家";
    const p46 = await jget("/v1/snapshot/pages/46");
    state.y2024 = extract2024(p46.text);
    state.y2024s = { cmb: state.y2024 };
    ASSETS_RENDER = renderAssets();
    renderDemoShell();
    greet();
    refreshTasks();
  } catch (e) {
    const hb = $("#health-badge");
    hb.className = "badge destructive";
    hb.textContent = "初始化失败";
    addMsg("editor-in-chief", '<span style="color:var(--destructive)">初始化失败：' + esc(e.message) + "</span>");
  }
}
init();

initRunPanel();
</script>
