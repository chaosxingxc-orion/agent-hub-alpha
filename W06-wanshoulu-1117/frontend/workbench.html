<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W06 年报工作台 · 年度经营简报（多银行）</title>
<style>
/* ———— SkillHub 设计 token（与 skill hub 站点同源）———— */
:root {
  --shell: 1440px;
  --bg: #ffffff;
  --fg: #202020;
  --fg-hover: #111111;
  --muted: #737373;
  --border: rgba(0, 0, 0, .08);
  --card-border: rgba(0, 0, 0, .06);
  --surface: #f6f7f9;
  --surface-2: #eff1f4;
  --hover: hsl(214 70% 96%);
  --radius: 10px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0, 0, 0, .04);
  --success: hsl(160 60% 28%);
  --success-bg: hsl(160 60% 96%);
  --warning: hsl(38 90% 32%);
  --warning-bg: hsl(38 90% 95%);
  --destructive: hsl(0 55% 48%);
  --destructive-bg: hsl(0 55% 97%);
  --info: hsl(217 75% 45%);
  --info-bg: hsl(217 75% 96%);
  --sans: Inter, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--surface);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ———— 顶栏 ———— */
.topbar {
  background: var(--bg);
  border-bottom: 1px solid var(--card-border);
  padding: 0 max(28px, calc((100% - var(--shell)) / 2 + 28px));
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand { display: flex; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
.brand-mark {
  background: var(--fg); color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 5px; letter-spacing: .5px; align-self: center;
}
.brand-en { color: var(--muted); font-size: 12px; font-weight: 400; }
.top-status { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }

/* ———— 选项卡 ———— */
.tabs {
  background: var(--bg); border-bottom: 1px solid var(--card-border);
  padding: 0 max(28px, calc((100% - var(--shell)) / 2 + 28px)); display: flex; gap: 4px; position: sticky; top: 56px; z-index: 40;
}
.tab {
  appearance: none; border: none; background: none; cursor: pointer;
  font: inherit; font-size: 13.5px; color: var(--muted);
  padding: 11px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg); }

/* ———— 布局 ———— */
main { max-width: var(--shell); margin: 0 auto; padding: 26px 28px 80px; }
.view { display: none; animation: fadein .2s ease; }
.view.active { display: block; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ———— 卡片 ———— */
.card {
  background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px 22px;
}
.card + .card { margin-top: 16px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
.grid { display: grid; gap: 12px; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.kv { display: flex; gap: 10px; font-size: 13px; padding: 4px 0; }
.kv b { color: var(--muted); font-weight: 500; min-width: 84px; }

/* ———— 徽章 / chip ———— */
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  padding: 2px 9px; border-radius: 999px; letter-spacing: .2px; white-space: nowrap;
}
.badge.success { color: var(--success); background: var(--success-bg); }
.badge.warning { color: var(--warning); background: var(--warning-bg); }
.badge.destructive { color: var(--destructive); background: var(--destructive-bg); }
.badge.info { color: var(--info); background: var(--info-bg); }
.badge.neutral { color: var(--fg); background: var(--surface); border: 1px solid var(--border); font-weight: 500; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
  padding: 1px 8px; border-radius: 5px; background: var(--surface); color: var(--muted);
  border: 1px solid transparent; font-family: var(--mono);
}
a.chip, button.chip { cursor: pointer; transition: all .15s; }
a.chip:hover, button.chip:hover { background: var(--hover); color: var(--info); border-color: hsl(214 70% 88%); }
.chip.on { background: var(--fg); color: #fff; }

/* ———— 按钮 ———— */
.btn {
  appearance: none; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  border-radius: var(--radius-sm); padding: 7px 16px; transition: all .15s;
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
}
.btn:hover { background: var(--hover); border-color: hsl(214 70% 85%); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--fg); color: #fff; border-color: var(--fg); }
.btn.primary:hover:not(:disabled) { background: var(--fg-hover); border-color: var(--fg-hover); }
.btn.danger { color: var(--destructive); border-color: hsl(0 55% 80%); }
.btn.danger:hover:not(:disabled) { background: var(--destructive-bg); }
.btn.sm { padding: 4px 11px; font-size: 12px; }

/* ———— 等宽 / digest ———— */
.mono { font-family: var(--mono); font-size: 12px; }
.digest { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; line-height: 1.5; }

/* ———— 对话视图（页签 1）———— */
.chat-card { display: flex; flex-direction: column; height: calc(100vh - 236px); min-height: 520px; padding: 0; overflow: hidden; }

/* ———— Agent 运行实时面板（对照 Dify Tracing / Langfuse Timeline 设计）———— */
.chat-split { display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 30%, 460px); gap: 14px; align-items: stretch; }
.run-panel { display: flex; flex-direction: column; background: var(--bg, #fff); border: 1px solid var(--border, #e4e6eb); border-radius: 12px; overflow: hidden; min-height: 520px; height: calc(100vh - 236px); }
.run-panel.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; border-style: dashed; }
.rp-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border, #e4e6eb); }
.rp-head h3 { font-size: 13px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.rp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rp-stat { background: #f6f7f9; border-radius: 8px; padding: 7px 8px; text-align: center; }
.rp-stat .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rp-stat .k { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: .3px; }
.rp-toolbar { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border, #e4e6eb); align-items: center; }
.rp-view-tabs { display: flex; gap: 2px; background: #f0f1f4; border-radius: 8px; padding: 2px; }
.rp-vtab { font-size: 11.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; border: none; background: none; color: var(--muted); }
.rp-vtab.on { background: #fff; color: var(--fg); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.rp-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
/* 时间线节点（Langfuse Timeline 风格）*/
.rp-tl { position: relative; padding-left: 18px; }
.rp-tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: #e8eaef; }
.rp-node { position: relative; margin-bottom: 10px; border: 1px solid var(--border, #e4e6eb); border-radius: 10px; background: #fff; overflow: hidden; }
.rp-node::before { content: ""; position: absolute; left: -17px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--success, #1f9d61); box-shadow: 0 0 0 3px rgba(31,157,97,.15); }
.rp-node.running::before { background: #3b7bf5; animation: rpPulse 1.1s ease-in-out infinite; }
.rp-node.failed::before { background: #d64545; box-shadow: 0 0 0 3px rgba(214,69,69,.15); }
@keyframes rpPulse { 0%,100% { box-shadow: 0 0 0 2px rgba(59,123,245,.3);} 50% { box-shadow: 0 0 0 5px rgba(59,123,245,.12);} }
.rp-node-h { display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; }
.rp-node-h:hover { background: #f7f8fa; }
.rp-ntype { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; padding: 2px 6px; border-radius: 4px; background: #eceef2; color: #5b6470; }
.rp-ntype.ORCHESTRATOR { background: #e8e2fb; color: #6a3fc0; }
.rp-ntype.AGENT { background: #e0ecfb; color: #1d5fbf; }
.rp-ntype.CHECKER { background: #fdeede; color: #b25e09; }
.rp-ntype.GATEKEEP { background: #e2f3e9; color: #1f7a45; }
.rp-ntitle { flex: 1; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-nmeta { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 8px; flex: 0 0 auto; }
.rp-nstatus { font-size: 10.5px; font-weight: 700; }
.rp-node.running .rp-nstatus { color: #3b7bf5; }
.rp-node-b { display: none; padding: 4px 11px 10px; border-top: 1px dashed #e8eaef; background: #fbfcfd; }
.rp-node.open .rp-node-b { display: block; }
.rp-field { margin-top: 7px; }
.rp-field .fl { font-size: 10px; color: var(--muted); letter-spacing: .5px; margin-bottom: 3px; font-weight: 650; }
.rp-field .fv { font-size: 11.5px; line-height: 1.65; color: #333; word-break: break-all; }
.rp-thinking { font-size: 11.5px; color: #6b5bd6; background: #f4f2fd; border-left: 3px solid #a99df0; padding: 7px 10px; border-radius: 0 6px 6px 0; font-style: italic; }
.rp-tools .tc { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 8px; background: #f0f4f9; border-radius: 6px; margin-bottom: 4px; }
.rp-tools .tc .tn { font-family: ui-monospace, Consolas, monospace; color: #1d5fbf; }
.rp-tools .tc .tp { margin-left: auto; font-size: 9.5px; color: var(--muted); }
/* 图视图（Langfuse Graph 聚合模式简化版）*/
.rp-graph { display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
.rp-gnode { width: 200px; text-align: center; padding: 8px 10px; border: 1.5px solid var(--border, #e4e6eb); border-radius: 10px; font-size: 11.5px; background: #fff; margin: 4px 0; }
.rp-gnode .gtitle { font-weight: 650; font-size: 11.5px; }
.rp-gnode .gmeta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.rp-gnode.ok { border-color: #bfe5cf; background: #f4fbf7; }
.rp-par { display: flex; gap: 6px; }
.rp-garrow { color: #b8bec8; font-size: 13px; line-height: 1; margin: 1px 0; }
/* 运行中头部条 */
.rp-live-bar { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: #3b7bf5; padding: 6px 16px; background: #f0f5ff; border-bottom: 1px solid #dbe7ff; }
.rp-dot { width: 7px; height: 7px; border-radius: 50%; background: #3b7bf5; animation: rpPulse 1.1s infinite; }
.chat-log { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.chat-msg { display: flex; gap: 10px; max-width: 94%; }
.chat-msg.user { flex-direction: row-reverse; margin-left: auto; max-width: 80%; }
.m-avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 650; background: var(--surface-2); color: var(--muted);
}
.m-avatar.k-ORCHESTRATOR { background: var(--info-bg); color: var(--info); }
.m-avatar.k-CHECKER { background: var(--warning-bg); color: var(--warning); }
.m-avatar.k-APPROVER { background: var(--success-bg); color: var(--success); }
.m-avatar.k-USER { background: var(--fg); color: #fff; }
.m-main { min-width: 0; }
.m-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 12px; flex-wrap: wrap; }
.m-name { font-weight: 600; font-size: 12.5px; }
.m-time { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.m-text { font-size: 13.5px; line-height: 1.85; color: var(--fg); }
.m-text .quote { margin-top: 6px; margin-bottom: 2px; }
.chat-msg.user .m-text {
  background: var(--surface); border: 1px solid var(--card-border);
  border-radius: 10px 10px 2px 10px; padding: 8px 13px;
}
.quick-row {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px;
  border-top: 1px solid var(--card-border); background: var(--bg); min-height: 52px; align-items: center;
}
.quick-row:empty { display: none; }
.quick-hint { font-size: 12px; color: var(--muted); margin-right: 2px; white-space: nowrap; }
.chat-input { display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--card-border); }
.chat-input input {
  flex: 1; font: inherit; font-size: 13.5px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 9px 13px; outline: none; background: var(--bg);
  transition: border-color .15s;
}
.chat-input input:focus { border-color: hsl(214 70% 75%); }

/* ———— 资产库（页签 2）———— */
.group-h { font-size: 13px; font-weight: 650; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.group-h:first-child { margin-top: 0; }
.group-h .g-tag { font-size: 11px; font-family: var(--mono); color: var(--muted); font-weight: 500; }
.asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.asset-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.asset-tile { border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--bg); }
.asset-tile .t-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.asset-tile .t-name { font-size: 13px; font-weight: 600; }
.asset-tile .t-ver { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.asset-tile .t-desc { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 6px; }
.asset-tile .t-foot { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.asset-tile .t-meta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 9px; line-height: 1.8; }
.page-text {
  font-family: var(--serif); font-size: 14.5px; line-height: 2.1; white-space: pre-wrap;
  color: var(--fg); padding: 4px 2px; max-height: 380px; overflow-y: auto;
}
.page-text mark {
  background: hsl(160 60% 90%); color: inherit; padding: 0 2px; border-radius: 3px;
  box-shadow: inset 0 -1.5px 0 hsl(160 60% 55%);
}
.mi-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.mi-table th { text-align: left; font-size: 11.5px; color: var(--muted); border-bottom: 1.5px solid var(--fg); padding: 6px 8px; }
.mi-table td { border-bottom: 1px solid var(--card-border); padding: 6px 8px; }
.mi-table .cell-mono { font-family: var(--mono); font-size: 11.5px; }

/* ———— 报告库（页签 3）———— */
.reports-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
.reports-list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 220px); overflow-y: auto; }
.task-item {
  text-align: left; font: inherit; cursor: pointer; background: var(--bg);
  border: 1px solid var(--card-border); border-radius: var(--radius-sm);
  padding: 12px 14px; transition: all .15s;
}
.task-item:hover { background: var(--hover); }
.task-item.active { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.task-item .ti-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.task-item .ti-id { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.task-item .ti-sub { font-size: 12.5px; }
.task-item .ti-sum {
  font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.task-item .ti-time { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 6px; }
.reports-detail { min-width: 0; }

/* ———— 报告（年报级排版，可 A4 打印）———— */
.report-shell { display: flex; justify-content: center; }
.paper {
  background: #fff; width: 100%; max-width: 830px; border: 1px solid var(--card-border);
  border-radius: 4px; box-shadow: var(--shadow); padding: 60px 68px 56px;
}
.paper-header {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 44px;
  font-size: 11.5px; color: var(--muted); letter-spacing: 1px;
}
.rp-cover { text-align: center; padding: 30px 0 10px; }
.rp-cover .c-company { font-size: 30px; font-weight: 700; letter-spacing: 6px; margin-bottom: 14px; }
.rp-cover .c-title { font-size: 21px; font-weight: 600; letter-spacing: 2px; margin-bottom: 26px; }
.rp-cover .c-meta { font-size: 12.5px; color: var(--muted); line-height: 2; }
.rp-notice {
  text-align: left; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); padding: 18px 22px; margin: 34px 0 8px;
}
.rp-notice h4 { font-size: 13px; font-weight: 650; margin-bottom: 10px; letter-spacing: 1px; }
.rp-notice ol { padding-left: 19px; }
.rp-notice li { font-size: 12.5px; line-height: 1.9; color: #3d3d3d; }
.rp-h2 {
  font-size: 16.5px; font-weight: 650; margin: 38px 0 16px; padding-left: 11px;
  border-left: 3px solid var(--fg); letter-spacing: 1px;
}
.rp-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rp-table th {
  font-size: 12px; font-weight: 600; color: var(--muted); text-align: right;
  padding: 8px 10px; border-bottom: 1.5px solid var(--fg); letter-spacing: .5px;
}
.rp-table th:first-child { text-align: left; }
.rp-table td {
  font-size: 13.5px; text-align: right; padding: 8.5px 10px;
  border-bottom: 1px solid var(--card-border); font-variant-numeric: tabular-nums;
}
.rp-table td:first-child { text-align: left; font-family: var(--serif); }
.rp-table .num { font-family: var(--mono); font-size: 12.5px; }
.rp-table .delta { font-weight: 600; }
.rp-table .delta.up { color: var(--success); }
.rp-table .delta.down { color: var(--destructive); }
.rp-table-note { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.8; }
/* 图表（工件 charts 内联 SVG）：报告正文与对话流共用 */
.rp-chart { margin: 14px 0 6px; background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 16px 14px 10px; }
.rp-chart figcaption { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.7; }
.rp-chart figcaption b { color: var(--info); font-weight: 600; }
.m-chart { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 10px 8px 6px; margin: 8px 0; }
.m-chart svg { max-width: 100%; }
.rp-body { font-family: var(--serif); font-size: 14.5px; line-height: 2.15; text-align: justify; color: #262626; text-indent: 2em; }
.rp-refs { margin-top: 12px; text-indent: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rp-refs .ref-label { font-family: var(--sans); font-size: 11.5px; color: var(--muted); margin-right: 2px; }
.ref-chip {
  font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--info);
  background: var(--info-bg); border: 1px solid hsl(217 75% 88%);
  border-radius: 5px; padding: 1px 7px; cursor: pointer; transition: all .15s;
}
.ref-chip:hover { background: hsl(217 75% 92%); }
.rp-glossary { background: var(--surface); border-radius: var(--radius-sm); padding: 16px 20px; }
.rp-glossary dl { display: grid; grid-template-columns: 150px 1fr; row-gap: 8px; column-gap: 14px; }
.rp-glossary dt { font-size: 12.5px; font-weight: 600; }
.rp-glossary dd { font-size: 12.5px; color: var(--muted); }
.rp-footnote { border-top: 1px solid var(--border); margin-top: 42px; padding-top: 14px; }
.rp-footnote p { font-size: 11.5px; color: var(--muted); line-height: 1.9; }
.report-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }

/* ———— 核验结果（对话/报告库/演示链共用）———— */
.vio-row {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--destructive-bg); margin-bottom: 8px; font-size: 12.5px;
}
.vio-row.warn { background: var(--warning-bg); }
.vio-row .v-rule { font-family: var(--mono); font-weight: 700; font-size: 11.5px; color: var(--destructive); white-space: nowrap; }
.vio-row.warn .v-rule { color: var(--warning); }
.vio-row .v-target { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.vio-row .v-detail { color: #3d3d3d; line-height: 1.7; }
.pass-note { font-size: 12.5px; color: var(--success); background: var(--success-bg); border-radius: var(--radius-sm); padding: 10px 12px; }
/* ———— 演示链（页签 5）———— */
.step {
  display: grid; grid-template-columns: 44px 1fr; gap: 16px;
  background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px;
}
.step .s-no {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--muted); font-family: var(--mono); font-weight: 700; font-size: 14px;
  border: 1.5px solid transparent; margin-top: 2px;
}
.step.done .s-no { background: var(--success-bg); color: var(--success); border-color: hsl(160 60% 80%); }
.step.blocked .s-no { background: var(--destructive-bg); color: var(--destructive); border-color: hsl(0 55% 82%); }
.step.refused .s-no { background: var(--warning-bg); color: var(--warning); border-color: hsl(38 90% 75%); }
.step .s-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.step .s-title { font-size: 14px; font-weight: 650; }
.step .s-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.step .s-body { display: flex; flex-direction: column; gap: 10px; }
.quote {
  font-family: var(--serif); font-size: 13.5px; line-height: 1.9; padding: 12px 16px;
  background: var(--surface); border-left: 3px solid var(--border); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.quote mark { background: hsl(0 55% 92%); color: var(--destructive); font-weight: 650; padding: 0 2px; border-radius: 3px; }
.quote .fix { background: hsl(160 60% 90%); color: var(--success); font-weight: 650; padding: 0 2px; border-radius: 3px; }
.diff-banner {
  display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px;
  border: 1px solid hsl(0 55% 85%); background: var(--destructive-bg);
  border-radius: var(--radius-sm); padding: 11px 14px; color: #3d3d3d;
}
.approval-card {
  border: 1px solid hsl(160 60% 80%); background: var(--success-bg); border-radius: var(--radius-sm);
  padding: 14px 16px; font-size: 12.5px;
}
.approval-card .a-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px 18px; margin-top: 8px; }
.approval-card .a-grid b { color: var(--muted); font-weight: 500; }
.refused-card {
  border: 1px solid hsl(38 90% 72%); background: var(--warning-bg); border-radius: var(--radius-sm);
  padding: 14px 16px; font-size: 12.5px;
}

/* ———— 信源卡片（资产库/规则与释义）———— */
.src-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.src-card { background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.src-card .s-title { font-size: 13.5px; font-weight: 650; margin: 8px 0 10px; line-height: 1.5; }
.src-card .s-rows { font-size: 12.5px; color: var(--muted); line-height: 1.9; }
.src-card .s-rows b { color: var(--fg); font-weight: 500; }
.src-card .s-pages { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ———— 抽屉（引用证据）———— */
.drawer-mask { position: fixed; inset: 0; background: rgba(20,20,20,.32); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 90; }
.drawer-mask.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 92vw;
  background: var(--bg); border-left: 1px solid var(--border); box-shadow: -8px 0 30px rgba(0,0,0,.08);
  transform: translateX(100%); transition: transform .22s ease, width .25s ease; z-index: 95;
  padding: 26px 30px; overflow-y: auto;
}
/* 大内容模式（skill 详情/长文预览）：抽屉自动加宽 */
.drawer.wide { width: min(860px, 88vw); }
.drawer.wide .d-block .d-val, .drawer.wide .skill-doc { font-size: 13.5px; }
.drawer.wide .skill-doc { max-height: none; padding: 18px 22px; }
.drawer.wide .skill-doc pre { font-size: 12.5px; }
.drawer.wide .skill-doc table { font-size: 12.5px; }
.drawer.wide .d-bind-row { max-width: 100%; }
.drawer.open { transform: none; }
.drawer h3 { font-size: 14px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.drawer .d-close { appearance: none; border: none; background: none; font-size: 17px; cursor: pointer; color: var(--muted); line-height: 1; }
.drawer .d-close:hover { color: var(--fg); }
.d-block { margin-bottom: 16px; }
.d-block .d-label { font-size: 11.5px; font-weight: 650; color: var(--muted); letter-spacing: 1px; margin-bottom: 5px; }
.skill-tree { border:1px solid var(--line); border-radius:8px; padding:8px; max-height:240px; overflow:auto; background:#fafbf8; }
.st-group { font-size:11px; font-weight:650; color:var(--muted); letter-spacing:.5px; margin:8px 4px 4px; }
.st-file { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; }
.st-file:hover { background:rgba(43,95,217,.08); }
.st-file.sel { background:rgba(43,95,217,.14); outline:1px solid rgba(43,95,217,.35); }
.st-ico { flex:0 0 auto; }
.st-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
.st-size { flex:0 0 auto; font-size:10.5px; color:var(--muted); }
.skill-code { background:#f6f7f4; border:1px solid var(--line); border-radius:8px; padding:14px 16px; max-height:460px; overflow:auto; font-size:12px; line-height:1.65; font-family:ui-monospace,Consolas,monospace; }
.skill-doc { background:#fafbf8; border:1px solid var(--line); border-radius:8px; padding:14px 16px; max-height:420px; overflow:auto; font-size:12.5px; line-height:1.75; }
.skill-doc h2 { font-size:14.5px; margin:12px 0 6px; }
.skill-doc h3 { font-size:13.5px; margin:10px 0 5px; }
.skill-doc h4 { font-size:12.5px; margin:8px 0 4px; }
.skill-doc pre { background:#f0f2ec; padding:10px; border-radius:6px; overflow:auto; font-size:11.5px; }
.skill-doc table { border-collapse:collapse; margin:8px 0; font-size:11.5px; }
.skill-doc th, .skill-doc td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
.skill-doc th { background:#f0f2ec; }
.skill-doc code { background:#f0f2ec; padding:1px 5px; border-radius:3px; font-size:11.5px; }
.d-block .d-val { font-size: 13px; line-height: 1.7; }
.d-block .d-quote {
  font-family: var(--serif); font-size: 13.5px; line-height: 2; background: var(--surface);
  border-left: 3px solid var(--success); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 10px 14px;
}
.d-verify { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); }
/* ———— 资产卡片可点击 + 详情抽屉绑定行 ———— */
.asset-tile.clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.asset-tile.clickable:hover { border-color: hsl(214 70% 78%); box-shadow: 0 2px 12px rgba(0,0,0,.07); }
.asset-tile .t-summary {
  font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 8px;
  padding-top: 7px; border-top: 1px dashed var(--border);
}
.d-bind-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border: 1px solid var(--card-border); border-radius: var(--radius-sm);
  margin-bottom: 6px; background: var(--bg);
}
.d-bind-row .b-name { font-size: 12.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-bind-row .b-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); flex-shrink: 0; }
.d-bind-row .b-ops { display: flex; gap: 6px; flex-shrink: 0; }
/* ———— 报告目录（年报级）———— */
.rp-toc { margin: 32px 0 8px; padding: 18px 26px; background: var(--surface); border-radius: var(--radius-sm); }
.rp-toc h4 { font-family: var(--serif); font-size: 15px; font-weight: 650; letter-spacing: 8px; text-align: center; margin-bottom: 10px; }
.rp-toc ol { list-style: none; columns: 2; column-gap: 34px; }
.rp-toc li { font-family: var(--serif); font-size: 13px; line-height: 2.05; cursor: pointer; color: #333; border-bottom: 1px dotted var(--border); }
.rp-toc li:hover { color: var(--info); }
.rp-h2 { scroll-margin-top: 84px; }
/* ———— 资产库·注册自定义 Agent 表单 ———— */
.reg-form { display: grid; grid-template-columns: 1.3fr .7fr; gap: 10px; margin-top: 12px; }
.reg-form input, .reg-form select, .reg-form textarea {
  font: inherit; font-size: 13px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 10px; outline: none; background: var(--bg);
}
.reg-form input:focus, .reg-form select:focus, .reg-form textarea:focus { border-color: hsl(214 70% 75%); }
.reg-form .full { grid-column: 1 / -1; }
details summary::marker { color: var(--muted); }
.reg-form textarea { resize: vertical; min-height: 52px; }

/* ———— 打印（A4，仅打印报告库当前展开的年报）———— */
@media print {
  body { background: #fff; }
  .topbar, .tabs, .report-actions, .drawer, .drawer-mask, .no-print,
  .reports-list, .task-meta-card { display: none !important; }
  .view { display: none !important; }
  #view-reports { display: block !important; }
  .reports-layout { display: block; }
  main { max-width: none; padding: 0; }
  .paper { border: none; box-shadow: none; max-width: none; padding: 0; border-radius: 0; }
  .paper-header { position: fixed; top: 0; left: 0; right: 0; margin-bottom: 26px; }
  .paper { padding-top: 40px; }
  @page { size: A4; margin: 15mm 13mm; }
}
@media (max-width: 1020px) {
  .grid.cols-3, .asset-grid, .asset-grid.cols-2, .src-grid { grid-template-columns: 1fr; }
  .reports-layout { grid-template-columns: 1fr; }
  .reports-list { max-height: none; }
  .chat-split { grid-template-columns: 1fr; }
  .run-panel { min-height: 380px; height: auto; max-height: 60vh; }
  .chat-card { height: 70vh; min-height: 420px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">W06</span>年报工作台<span class="brand-en">Annual Report Workbench</span></div>
  <div class="top-status">
    <span id="health-badge" class="badge neutral">连接中…</span>
    <span class="mono" id="health-ver"></span>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button class="tab active" data-view="chat">对话</button>
  <button class="tab" data-view="assets">资产库</button>
  <button class="tab" data-view="reports">报告库</button>
</nav>
<main>
  <section class="view active" id="view-chat">
    <div class="chat-split">
      <div class="card chat-card">
        <div class="chat-log" id="chat-log"></div>
      <div class="quick-row" id="quick-row"></div>
      <form class="chat-input" id="chat-form" autocomplete="off">
        <input id="chat-input" placeholder="自由输入：确认主体 / 粘贴补充资料 / 口径问答 / 重新生成 / 跳转页签……">
        <label class="btn" style="white-space:nowrap;cursor:pointer;flex:none">导入资料<input type="file" id="doc-file" multiple
          accept=".pdf,.txt,.md,.markdown,.json" hidden></label>
        <button class="btn primary" type="submit">发送</button>
      </form>
      </div>
      <aside class="run-panel" id="run-panel"></aside>
    </div>
  </section>
  <section class="view" id="view-assets"></section>
  <section class="view" id="view-reports"></section>
  <section class="view" id="view-demo"></section>
</main>
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer"></aside>
<script>
"use strict";
/* ———————————————————— 基础工具 ———————————————————— */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}
async function jpost(url, body) {
  const r = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return { ok: r.ok, status: r.status, data: await r.json().catch(() => null) };
}
const short = (d, n = 10) => d ? d.slice(0, n) + "…" : "—";
const DELTA_LABEL = { PERCENTAGE_POINT: "个百分点", BASIS_POINT: "基点", PERCENT: "%", YUAN: "亿元" };
const deltaText = m => (m.yoy_delta ?? "") + (DELTA_LABEL[m.delta_unit] ?? "");
const deltaDir = m => { const d = parseFloat(m.yoy_delta); return d > 0 ? "up" : d < 0 ? "down" : ""; };
const clone = o => JSON.parse(JSON.stringify(o));
const nowTime = () => new Date().toLocaleTimeString("zh-CN", { hour12: false });

const STATUS_LABEL = {
  PASSED: ["success", "通过"], FAILED: ["destructive", "未通过"],
  WAITING_HUMAN: ["warning", "待人工复核"], NONE: ["neutral", "无批准"],
  APPROVED: ["success", "已批准"], REFUSED: ["destructive", "已拒绝"],
  GENERATING: ["warning", "生成中"], GENERATED: ["info", "草稿就绪"],
  RUNNING: ["success", "运行中"], AVAILABLE: ["neutral", "待安装"]
};
const statusBadge = s => {
  const [cls, label] = STATUS_LABEL[s] || ["neutral", s || "—"];
  return '<span class="badge ' + cls + '">' + esc(label) + "</span>";
};

const KIND_LABEL = {
  ORCHESTRATOR: ["info", "编排"], ANALYST: ["neutral", "分析"],
  CHECKER: ["warning", "核验"], APPROVER: ["success", "批准"]
};
const kindBadge = k => {
  const [cls, label] = KIND_LABEL[k] || ["neutral", k || "—"];
  return '<span class="badge ' + cls + '">' + esc(label) + "</span>";
};

/* 核验违规行（对话 / 报告库 / 演示链共用渲染） */
const vioRows = vs => (vs || []).map(v =>
  '<div class="vio-row' + (v.severity === "WARNING" ? " warn" : "") + '">'
  + '<span class="v-rule">' + esc(v.rule) + "</span>"
  + "<div><div class=\"v-detail\">" + esc(v.detail) + "</div>"
  + '<div class="v-target">target: ' + esc(v.target) + " · " + esc(v.severity) + "</div></div></div>").join("");

/* 2024 对比值：从快照 P46 文本提取（口径与 P46 原文逐字对应） */
function extract2024(text) {
  const m = (re) => { const x = text.match(re); return x ? x[1] : null; };
  return {
    OPERATING_REVENUE: m(/营业收入([\d,\.]+)亿元/),
    NET_PROFIT_ATTRIBUTABLE: m(/净利润([\d,\.]+)亿元/),
    NET_INTEREST_MARGIN: m(/净息差([\d\.]+)%/),
    COST_INCOME_RATIO: m(/成本收入比([\d\.]+)%/),
    NPL_BALANCE: m(/不良贷款余额([\d,\.]+)亿元/),
    NPL_RATIO: m(/不良贷款率([\d\.]+)%/),
    PROVISION_COVERAGE: m(/拨备覆盖率([\d\.]+)%/),
    CET1_RATIO: m(/核心一级资本充足率([\d\.]+)%/)
  };
}

/* ———————————————————— 全局状态 ———————————————————— */
const state = {
  manifest: null, manifests: {},  // 各银行快照 manifest（key=银行目录名）；manifest 为默认（cmb）
  banks: [],               // 银行清单（/v1/banks）
  sources: [], health: null,
  positive: null,          // 正例工件（只读底稿，招行演示链用）
  artifact: null,          // 当前工作工件（演示链会修改它）
  citeArtifact: null,      // 引用抽屉/快照高亮当前指向的工件
  y2024: {}, y2024s: {},   // 2024 对比值（快照 P46 提取，按银行缓存；y2024 兼容指向招行）
  pages: {},               // 快照页缓存
  approval: null,
  tasks: [], selectedTask: null,
  demo: { done: {} }
};

/* ———————————————————— 本地文档导入（live 快照集 + sha256 注册纪律门）———————————————————— */
let DOC_PENDING = [];
$("#doc-file").addEventListener("change", e => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  DOC_PENDING = files;
  e.target.value = "";
  openImportDrawer();
});
async function b64Of(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
async function openImportDrawer() {
  const rows = DOC_PENDING.map((f, i) =>
    '<div class="d-block"><div class="d-label">文件 ' + (i + 1) + '</div><div class="d-val">'
    + esc(f.name) + " · " + (f.size / 1024).toFixed(1) + " KB</div></div>").join("");
  $("#drawer").innerHTML =
    "<h3>导入本地资料<button class=\"d-close\" onclick=\"closeDrawer()\">×</button></h3>"
    + '<div class="d-block"><div class="d-label">纪律门</div><div class="d-val">资料将落盘 live 快照集并经 sha256 '
    + "注册进信源注册表（与 MCP 联网抓取同一纪律门），注册后引用核验（C1/C2）与数值核验即刻接受；"
    + "生成报告时自动挂载为可引用论断，writer-agent 可直接引用。冻结演示快照（cmb/icbc/ccb）零改动，无需重启。</div></div>"
    + rows
    + '<div class="d-block"><div class="d-label">信源标题（可改）</div>'
    + '<input id="doc-title" style="width:100%" value="'
    + esc(DOC_PENDING[0] ? DOC_PENDING[0].name.replace(/\.[^.]+$/, "") : "本地资料") + '"></div>'
    + '<div class="d-block"><div class="d-label">权威等级</div>'
    + '<select id="doc-authority" style="width:100%">'
    + '<option value="PRIMARY_OFFICIAL">PRIMARY_OFFICIAL（官方一手，可支撑指标值）</option>'
    + '<option value="SECONDARY_INSTITUTIONAL">SECONDARY_INSTITUTIONAL（机构二手）</option>'
    + '<option value="TERTIARY_AGGREGATED">TERTIARY_AGGREGATED（聚合三手）</option>'
    + "</select></div>"
    + '<div class="d-block"><button class="btn primary" id="doc-submit">确认导入</button> '
    + '<span id="doc-status" class="digest"></span></div>';
  $("#drawer").classList.add("open");
  $("#drawer-mask").classList.add("open");
  $("#doc-submit").addEventListener("click", submitImport);
}
async function submitImport() {
  const st = $("#doc-status");
  st.textContent = "解析与落盘中……";
  try {
    const files = [];
    for (const f of DOC_PENDING) files.push({ filename: f.name, content_base64: await b64Of(f) });
    const r = await jpost("/v1/documents/import", {
      title: ($("#doc-title") || {}).value || "",
      authority: ($("#doc-authority") || {}).value || "PRIMARY_OFFICIAL",
      files
    });
    closeDrawer();
    if (!r.ok || !(r.data || {}).ok) {
      addMsg("editor-in-chief", "资料导入失败：" + esc((r.data || {}).error || "HTTP " + r.status));
      return;
    }
    addDocResultMsg(r.data);
  } catch (e) {
    closeDrawer();
    addMsg("editor-in-chief", "资料导入异常：" + esc(String(e)));
  }
}
async function importPasted(text) {
  try {
    const r = await jpost("/v1/documents/import", { title: "对话粘贴补充资料", text });
    if (!r.ok || !(r.data || {}).ok) {
      addMsg("material-agent", "补充资料注册失败：" + esc((r.data || {}).error || "HTTP " + r.status)
        + "。可继续粘贴，或点击「资料齐备，开始编制」。");
      return;
    }
    addDocResultMsg(r.data, "补充资料已落盘 live 快照集并注册进信源注册表：");
    setQuick([{ label: "资料齐备，开始编制", cls: "primary", fn: startClarify }], "确认无误后开始，也可在下方补充资料：");
  } catch (e) {
    addMsg("material-agent", "补充资料注册异常：" + esc(String(e)));
  }
}
function addDocResultMsg(data, head) {
  const rows = (data.imported || []).map(x =>
    "<li>「" + esc(x.commit.title) + "」→ " + esc(x.commit.source_id)
    + " · 快照 P" + (x.commit.snapshot_pages || []).map(p => p.snapshot_page).join("、P")
    + " · 指纹 " + esc(short(x.commit.content_sha256, 16)) + "</li>").join("");
  const errs = (data.errors || []).map(x => "<li>" + esc(x.filename) + "：" + esc(x.error) + "</li>").join("");
  addMsg("material-agent", (head || "本地资料导入完成，已落盘 live 快照集并注册进信源注册表：")
    + "<ul>" + rows + "</ul>" + (errs ? "部分文件未成功：<ul>" + errs + "</ul>" : "")
    + "生成报告时将自动挂载为可引用论断（[C-n]），writer-agent 可直接引用。");
}

let QUICK_FNS = [];

/* 对话状态机：greet → bank → material → clarify → generating → (fix) → wait_approval → done */
function greet() {
  chat.stage = "greet";
  addMsg("editor-in-chief",
    "您好，我是主编编排 Agent（editor-in-chief）。这里由多专业 agent 协同完成年度经营简报的编制：<br>"
    + "资料装载 → 口径澄清 → 分节成稿 → 确定性核验 → 具名批准交付。<br>"
    + "首先请选择编制主体（支持多家银行的年报快照）。");
  const opts = (state.banks.length ? state.banks.filter(b => b.bank !== "live") : [{ bank: "cmb", company: "招商银行" }])
    .map(b => ({ label: b.company + " · 2025 年度", cls: b.bank === "cmb" ? "primary" : "", fn: () => pickBank(b) }));
  setQuick(opts, "点击选择编制主体：");
}

async function pickBank(b) {
  setQuick([]);
  chat.bank = b.bank;
  addMsg("user", "选择编制主体：" + b.company + "，报告期 2025 年度。");
  addMsg("editor-in-chief", "已受理：" + b.company + " 2025 年度经营简报。转交资料管理 Agent 装载信源快照。");
  chat.stage = "material";
  addMsg("material-agent", "正在装载信源快照……");
  try {
    if (!state.y2024s[b.bank]) {
      const p46 = await jget("/v1/snapshot/pages/46?bank=" + b.bank);
      state.y2024s[b.bank] = extract2024(p46.text);
    }
    const [sources] = await Promise.all([jget("/v1/sources")]);
    state.sources = sources;
    const m = state.manifests[b.bank];
    const pages = Object.keys((m && m.page_digests) || {}).join(" / ");
    addMsg("material-agent",
      "信源装载完成：<br>"
      + "· 信源 <b>" + m.sources.length + "</b> 份（" + esc(b.company) + "公开披露年报落盘快照，content_sha256 已登记）<br>"
      + "· 快照页 P" + pages + " · 指标索引 " + Object.keys(m.metric_index).length + " 项 · 释义 " + (m.entities || []).length + " 条<br>"
      + "如需补充资料可直接粘贴文本（将登记为编制依据），或点击下方按钮开始编制。");
    setQuick([{ label: "资料齐备，开始编制", cls: "primary", fn: startClarify }], "确认无误后开始，也可在下方补充资料：");
  } catch (e) {
    addMsg("material-agent", '<span style="color:var(--destructive)">信源装载失败：' + esc(e.message) + "</span>");
    setQuick([{ label: "重试装载", cls: "primary", fn: () => pickBank(b) }]);
  }
}

function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

async function startClarify() {
  setQuick([]);
  chat.stage = "clarify";
  // 口径澄清对象数据驱动：delta_unit=PERCENTAGE_POINT 即「比率类 + 百分点表述」（N7 口径铁律的领域判据），
  // 按变动幅度取最大者（无指标名硬编码；value 是否带 % 不作为判据——模板工件与 demo 工件格式可不同）
  let art = null;
  try {
    art = chat.bank === "cmb" ? state.positive : await jget("/v1/artifacts/template?bank=" + encodeURIComponent(chat.bank));
  } catch (e) { art = null; }
  const cands = art && art.metrics
    ? art.metrics.filter(x => x.delta_unit === "PERCENTAGE_POINT")
    : [];
  const cand = cands.sort((a, b) => Math.abs(Number(b.yoy_delta || 0)) - Math.abs(Number(a.yoy_delta || 0)))[0] || null;
  if (!cand) {
    addMsg("editor-in-chief", "编制前口径检查完成：工件中无需澄清项。");
    addMsg("risk-analyst", "未发现需要口径澄清的比率类变动，按披露惯例直接进入编制。");
    startGeneration(true);
    return;
  }
  addMsg("editor-in-chief", "进入编制前有一处口径需要澄清。");
  const midx = (state.manifests[chat.bank] || {}).metric_index || {};
  const label = (midx[cand.key] || {}).label || cand.key;
  const dd = Number(cand.yoy_delta);
  const dirTxt = dd < 0 ? "下降 " : "上升 ";
  chat.clarify = { key: cand.key, label: label, delta: Math.abs(dd) };
  addMsg("risk-analyst",
    "编制「资产质量」章节时需要确认变动口径：<b>" + esc(label) + " " + esc(cand.value) + "</b>，较上年末" + dirTxt + "<b>" + Math.abs(dd) + "</b>。<br>"
    + "按监管披露惯例，比率类指标的变动应以什么口径表述？");
  setQuick([
    { label: "个百分点（披露惯例）", cls: "primary", fn: () => answerClarify(true) },
    { label: "百分比 %（演示拦截路径）", fn: () => answerClarify(false) }
  ], "选择变动表述口径：");
}

function answerClarify(correct) {
  setQuick([]);
  addMsg("user", correct ? "以「个百分点」表述。" : "以「%」表述。");
  addMsg("risk-analyst", correct
    ? "收到：比率类变动以「个百分点」表述，与 N7 变动口径铁律一致。"
    : "收到：按「%」口径表述。（注：该口径与披露惯例不符，数值核验器将执行拦截）");
  startGeneration(correct);
}

async function startGeneration(correct) {
  chat.stage = "generating";
  const bank = state.banks.find(x => x.bank === chat.bank) || { bank: "cmb", company: "招商银行" };
  addMsg("editor-in-chief", "开始编制（" + esc(bank.company) + "）。先向服务端登记任务（获取任务编号，报告库可实时查看进度）……");
  let base;
  try {
    base = chat.bank === "cmb" ? clone(state.positive)
      : await jget("/v1/artifacts/template?bank=" + encodeURIComponent(chat.bank));
  } catch (e) {
    addMsg("editor-in-chief", '<span style="color:var(--destructive)">模板工件加载失败：' + esc(e.message) + "</span>");
    setQuick([{ label: "重试", cls: "primary", fn: () => startGeneration(correct) }]);
    return;
  }
  if (!correct) {
    // 演示腐化：澄清指标的比率变动句「个百分点」→「%」——按「指标名 + 上升/下降变动表述」联合定位目标句（无节号/指标名硬编码），
    // 跳过仅含上年基数的对比句（如摘要节的「2024年……成本收入比26.96%。」）
    const lbl = (chat.clarify && chat.clarify.label) || "拨备覆盖率";
    const corruptOf = s => (s.body || "").match(new RegExp(escRe(lbl) + "[^。]*?(?:上升|下降)\\d+(?:\\.\\d+)?个百分点")) ? s : null;
    const sec = base.sections.map(corruptOf).find(Boolean);
    if (sec) sec.body = sec.body.replace(new RegExp("(" + escRe(lbl) + "[^。]*?(?:上升|下降))(\\d+(?:\\.\\d+)?)个百分点", "g"), "$1$2%");
  }
  const r = await jpost("/v1/tasks", {
    task: { status: "GENERATING", summary: bank.company + " 2025 年度经营简报（对话式编制）" },
    artifact: base
  });
  if (!r.ok) {
    addMsg("editor-in-chief", '<span style="color:var(--destructive)">任务登记失败：HTTP ' + r.status + "</span>");
    setQuick([{ label: "重试", cls: "primary", fn: () => startGeneration(correct) }]);
    return;
  }
  chat.taskId = r.data.task_id;
  base.task_id = chat.taskId;
  chat.artifact = base;
  addMsg("editor-in-chief",
    "任务已登记：<span class=\"mono\">" + esc(chat.taskId) + "</span>。启动六工位流水线（查数 → 分析 → 图表 → 写作 → 核验 → 主编），各工位按骨架配置分派……");
  // 六工位流水线：播报内容全部来自服务端 stages[]（headline/details），前端只渲染不编造
  const p = await jpost("/v1/pipeline/run", { bank: chat.bank, task_id: chat.taskId });
  if (!p.ok || !p.data || !p.data.stages) {
    addMsg("editor-in-chief", '<span style="color:var(--destructive)">流水线执行失败：HTTP ' + (p.status || "—") + " " + esc((p.data && p.data.error) || "") + "</span>");
    setQuick([{ label: "重试", cls: "primary", fn: () => startGeneration(correct) }]);
    return;
  }
  for (const st of p.data.stages) {
    if (st.stage_id === "writing") continue; // 写作工位在下方逐节播报
    const agentOf = { material: "material-agent", chart: "chart-agent", checking: "numeric-checker", consolidation: "editor-in-chief" };
    const aid = agentOf[st.stage_id] || String(st.agent || "").split(",")[0].trim() || "editor-in-chief";
    await jpost("/v1/agents/load", { agent_id: aid, task_id: chat.taskId });
    const det = (st.details || []);
    const head = det.slice(0, st.stage_id === "analysis" ? 4 : 2).map(d => '<div class="quote">' + esc(d) + "</div>").join("");
    const more = det.length > (st.stage_id === "analysis" ? 4 : 2) ? '<span style="font-size:12px;color:var(--muted)">…共 ' + det.length + " 条</span>" : "";
    addMsg(aid, "【" + esc(st.name) + "工位】" + esc(st.headline) + head + more);
  }
  // 写作工位：按服务端 details（节序/标题/责任 agent 来自骨架配置）逐节播报
  const wr = p.data.stages.find(s => s.stage_id === "writing");
  for (const line of (wr && wr.details) || []) {
    const m = line.match(/^(S-\d+)\s+(.*)$/);
    if (!m) continue;
    const parts = m[2].split(" · 责任 ");
    const sec = chat.artifact.sections.find(s => s.section_id === m[1]);
    if (!sec) continue;
    const aid = ((parts[1] || "").match(/^\S+/) || ["editor-in-chief"])[0];
    await jpost("/v1/agents/load", { agent_id: aid, task_id: chat.taskId });
    const fs = (sec.body.match(/^[^。]{0,120}。/) || [sec.body.slice(0, 90) + "……"])[0];
    const ch = (chat.artifact.charts || []).find(c => c.section_id === m[1]);
    addMsg(aid, esc(sec.title) + " 成稿："
      + '<div class="quote">' + esc(fs) + "</div>"
      + (ch ? '<div class="m-chart">' + chartSvg(ch, false) + "</div>" : "")
      + "指标与引用已绑定快照页码与摘录指纹"
      + (ch ? "，图表（" + esc(ch.id) + "）已随稿生成" : "") + "。");
  }
  const nCharts = (chat.artifact.charts || []).length;
  addMsg("editor-in-chief",
    "草稿完成（" + chat.artifact.metrics.length + " 项指标 · " + chat.artifact.citations.length
    + " 条引用 · " + chat.artifact.sections.length + " 节正文"
    + (nCharts ? " · " + nCharts + " 幅图表" : "") + "）。提交确定性核验，先数值后引用。");
  runNumericCheck();
}

async function runNumericCheck() {
  await jpost("/v1/agents/load", { agent_id: "numeric-checker", task_id: chat.taskId });
  const n = await jpost("/v1/checks/numeric", chat.artifact);
  if (!n.ok || !n.data) {
    addMsg("numeric-checker", '<span style="color:var(--destructive)">核验请求失败：HTTP ' + n.status + "</span>");
    return;
  }
  if (n.data.status !== "PASSED") {
    chat.stage = "fix";
    addMsg("numeric-checker",
      "数值核验 <b style=\"color:var(--destructive)\">FAILED</b> —— 以下违规项 BLOCKING，草稿被当场拦截："
      + vioRows(n.data.violations)
      + '<span style="font-size:12px;color:var(--muted)">N7「变动口径铁律」：比率类指标变动必须以「个百分点」表述，「%」口径不放行。</span>');
    setQuick([{ label: "采纳修订：改为「个百分点」", cls: "primary", fn: applyFix }]);
    return;
  }
  addMsg("numeric-checker",
    "数值核验 PASSED（v" + esc(n.data.checker_version) + "）：N1–N7 全部通过，无违规项。");
  runCitationCheck();
}

async function applyFix() {
  setQuick([]);
  addMsg("user", "采纳修订：改为「个百分点」。");
  // 修订目标句按「指标名 + 上升/下降变动表述（% 口径）」联合定位（无节号/指标名硬编码）
  const lbl = (chat.clarify && chat.clarify.label) || "拨备覆盖率";
  const sec = chat.artifact.sections.find(s =>
    new RegExp(escRe(lbl) + "[^。]*?(?:上升|下降)\\d+(?:\\.\\d+)?%").test(s.body || ""));
  if (!sec) {
    addMsg("risk-analyst", '<span style="color:var(--destructive)">未在草稿中找到待修订句。</span>');
    return;
  }
  sec.body = sec.body.replace(new RegExp("(" + escRe(lbl) + "[^。]*?(?:上升|下降))(\\d+(?:\\.\\d+)?)%", "g"), "$1$2个百分点");
  const sent = sec.body.match(new RegExp(escRe(lbl) + "[^。]*。"))?.[0] || "";
  addMsg("risk-analyst", "已修订（仅改该句口径，其余内容零改动）："
    + '<div class="quote">' + esc(sent).replace(/(?:上升|下降)(\d+(?:\.\d+)?)个百分点/,
      '<span class="fix">$&</span>') + "</div>");
  addMsg("editor-in-chief", "重新提交数值核验。");
  runNumericCheck();
}

async function runCitationCheck() {
  await jpost("/v1/agents/load", { agent_id: "citation-checker", task_id: chat.taskId });
  const c = await jpost("/v1/checks/citation", chat.artifact);
  if (!c.ok || !c.data) {
    addMsg("citation-checker", '<span style="color:var(--destructive)">核验请求失败：HTTP ' + c.status + "</span>");
    return;
  }
  if (c.data.status !== "PASSED") {
    addMsg("citation-checker", "引用核验 <b style=\"color:var(--destructive)\">FAILED</b>：" + vioRows(c.data.violations));
    setQuick([{ label: "重新生成一份", cls: "primary", fn: resetChat }]);
    return;
  }
  addMsg("citation-checker",
    "引用核验 PASSED（v" + esc(c.data.checker_version) + "）：" + chat.artifact.citations.length
    + " 条引用摘录指纹一致、页内字面存在、信源均在注册表内。");
  await jpost("/v1/tasks", {
    task: { task_id: chat.taskId, status: "GENERATED", summary: (chat.artifact.report_period || "2025 年度") + "经营简报：两项核验 PASSED，等待具名批准" },
    artifact: chat.artifact
  });
  chat.stage = "wait_approval";
  addMsg("approver",
    "两项核验全部 PASSED。交付批准须<b>具名确认</b>——批准记录将与工件内容指纹（sha256）绑定，内容一改批准即失效。");
  setQuick([{ label: "Alice 确认交付", cls: "primary", fn: approveDelivery }]);
}

    + "<span><b>数值核验</b>PASSED · " + esc(r.data.checks.numeric.checker_version) + "</span>"
    + "<span><b>引用核验</b>PASSED · " + esc(r.data.checks.citation.checker_version) + "</span></div>"

function resetChat() {
  $("#chat-log").innerHTML = "";
  chat.stage = "greet"; chat.bank = "cmb"; chat.artifact = null; chat.taskId = null;
  greet();
}

/* 自由输入：全局意图 + 阶段意图匹配 */
function handleFreeInput(text) {
  addMsg("user", text);
  /* 全局跳转意图 */
  if (/重新生成|再来一份|重新来/.test(text)) {
    addMsg("editor-in-chief", "好的，重新开始编制流程。"); resetChat(); return;
  }
  if (/报告/.test(text)) { addMsg("editor-in-chief", "已为您切换到报告库。"); switchTab("reports"); return; }
  if (/资产/.test(text)) { addMsg("editor-in-chief", "已为您切换到资产库。"); switchTab("assets"); return; }
  if (/agent|hub|智能体/i.test(text)) { addMsg("editor-in-chief", "Agent 管理已整合进资产库，已为您切换。"); switchTab("assets"); return; }
  if (/演示/.test(text)) { addMsg("editor-in-chief", "已为您打开验收演示（也可在资产库底部展开入口）。"); switchTab("demo"); return; }
  /* 阶段意图 */
  if (chat.stage === "greet") {
    if (/你好|您好|hi|hello/i.test(text)) {
      addMsg("editor-in-chief", "您好！请选择编制主体（可点击下方快捷按钮）。");
    } else if (/工商/.test(text)) {
      pickBank(state.banks.find(x => x.bank === "icbc") || { bank: "icbc", company: "中国工商银行" });
    } else if (/建设/.test(text)) {
      pickBank(state.banks.find(x => x.bank === "ccb") || { bank: "ccb", company: "中国建设银行" });
    } else if (/确认|招商|2025/.test(text)) {
      pickBank(state.banks.find(x => x.bank === "cmb") || { bank: "cmb", company: "招商银行" });
    } else {
      addMsg("editor-in-chief", "请先选择编制主体：招商银行 / 中国工商银行 / 中国建设银行 · 2025 年度（可点击下方快捷按钮）。");
    }
  } else if (chat.stage === "material") {
    if (/齐备|开始|编制/.test(text)) { startClarify(); }
    else {
      addMsg("material-agent", "正在将补充资料落盘注册（与联网抓取同一 sha256 纪律门）……");
      importPasted(text);
    }
  } else if (chat.stage === "clarify") {
    if (/个百分点|百分点/.test(text)) answerClarify(true);
    else if (/%|百分比/.test(text)) answerClarify(false);
    else addMsg("risk-analyst", "请明确变动口径：回复「个百分点」或「百分比」，或点击下方快捷按钮。");
  } else if (chat.stage === "fix") {
    addMsg("editor-in-chief", "草稿已被核验器拦截，请点击「采纳修订：改为『个百分点』」处理违规项。");
  } else if (chat.stage === "generating") {
    addMsg("editor-in-chief", "编制进行中，请稍候……");
  } else if (chat.stage === "wait_approval") {
    addMsg("editor-in-chief", "两项核验已通过，等待具名批准。可点击「Alice 确认交付」，或输入「重新生成」。");
  } else {
    addMsg("editor-in-chief", "本次任务已完成。可「在报告库查看」，或输入「重新生成」再来一份。");
  }
}
$("#chat-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#chat-input");
  const v = input.value.trim();
  if (!v) return;
  input.value = "";
  handleFreeInput(v);
});
/* ———————————————————— 图表内联 SVG（bar/line/pie/flow，工件 charts 数据驱动，无外部库）———————————————————— */
function fmtNum(v) {
  const n = Number(v);
  return Number.isInteger(n) ? String(n)
    : n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const CHART_C1 = "hsl(217, 75%, 45%)";   /* 系列一（蓝） */
const CHART_C2 = "hsl(160, 55%, 38%)";   /* 系列二（绿） */
function chartSvg(ch, wide) {
  if (!ch) return "";
  const W = wide ? 620 : 300;
  if (ch.type === "bar") return barSvg(ch, W, wide ? 300 : 220);
  if (ch.type === "line") return lineSvg(ch, W, wide ? 300 : 220);
  if (ch.type === "pie") return pieSvg(ch, wide ? 420 : 300, wide ? 260 : 210);
  if (ch.type === "flow") return flowSvg(ch, W);
  return "";
}
function svgOpen(w, h) {
  return '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" style="max-width:' + w
    + 'px;display:block;margin:0 auto" font-family="var(--sans)" role="img">';
}
function legend(items, W, y) {
  let x = W / 2 - items.length * 62;
  let s = "";
  for (const [name, color] of items) {
    s += '<rect x="' + x + '" y="' + (y - 9) + '" width="11" height="11" rx="2.5" fill="' + color + '"/>'
      + '<text x="' + (x + 16) + '" y="' + y + '" font-size="12" fill="var(--fg)">' + esc(name) + "</text>";
    x += 24 + esc(name).replace(/[^\x00-\xff]/g, "aa").length * 6 + 34;
  }
  return s;
}
/* 分组柱形图：本期 vs 上年两系列、等距分组、柱顶数值标注 */
function barSvg(ch, W, H) {
  const L = 64, R = 14, T = 18, B = 46;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(...ch.series.flatMap(s => s.values)) * 1.12;
  const y = v => T + ph - (v / max) * ph;
  const groups = ch.labels.length;
  const gw = pw / groups, bw = Math.min(44, (gw - 34) / ch.series.length);
  let s = svgOpen(W, H);
  [0, .5, 1].forEach(f => {
    const gy = T + ph - f * ph, val = max * f;
    s += '<line x1="' + L + '" y1="' + gy + '" x2="' + (W - R) + '" y2="' + gy + '" stroke="var(--border)"/>'
      + '<text x="' + (L - 6) + '" y="' + (gy + 4) + '" font-size="10.5" fill="var(--muted)" text-anchor="end">' + fmtNum(val) + "</text>";
  });
  ch.labels.forEach((lab, gi) => {
    ch.series.forEach((ser, si) => {
      const v = ser.values[gi];
      const bx = L + gw * gi + gw / 2 - (ch.series.length * bw + 6 * (ch.series.length - 1)) / 2 + si * (bw + 6);
      s += '<rect x="' + bx.toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + bw + '" height="'
        + (T + ph - y(v)).toFixed(1) + '" rx="3" fill="' + (si ? CHART_C2 : CHART_C1) + '" opacity=".88"/>'
        + '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (y(v) - 5).toFixed(1)
        + '" font-size="10.5" fill="var(--fg)" text-anchor="middle">' + fmtNum(v) + "</text>";
    });
    s += '<text x="' + (L + gw * gi + gw / 2) + '" y="' + (H - 26) + '" font-size="12" fill="var(--muted)" text-anchor="middle">' + esc(lab) + "</text>";
  });
  s += legend(ch.series.map((ser, i) => [ser.name, i ? CHART_C2 : CHART_C1]), W, H - 6) + "</svg>";
  return s;
}
/* 双系列折线：两量纲差异大时各系列按自身量程绘制（数值以标注为准），左轴系列一、右轴系列二 */
function lineSvg(ch, W, H) {
  const L = 56, R = 56, T = 18, B = 46;
  const pw = W - L - R, ph = H - T - B;
  const n = Math.max(...ch.series.map(s => s.values.length));
  const px = i => L + (n === 1 ? pw / 2 : (pw * i) / (n - 1));
  let s = svgOpen(W, H);
  ch.series.forEach((ser, si) => {
    const lo = Math.min(...ser.values) * (si ? 0.92 : 0.75), hi = Math.max(...ser.values) * 1.08;
    const y = v => T + ph - ((v - lo) / (hi - lo)) * ph;
    const color = si ? CHART_C2 : CHART_C1;
    const pts = ser.values.map((v, i) => px(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    s += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2.2"/>';
    ser.values.forEach((v, i) => {
      const anchor = si ? "start" : "end", dx = si ? 8 : -8;
      s += '<circle cx="' + px(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.6" fill="' + color + '"/>'
        + '<text x="' + (px(i) + dx).toFixed(1) + '" y="' + (y(v) + 4).toFixed(1) + '" font-size="10.5" fill="var(--fg)" text-anchor="'
        + anchor + '">' + fmtNum(v) + (ch.unit || "") + "</text>";
    });
    [lo, hi].forEach(v => {
      const ax = si ? W - R + 6 : L - 6;
      s += '<text x="' + ax + '" y="' + (y(v) + 4).toFixed(1) + '" font-size="10.5" fill="var(--muted)" text-anchor="'
        + (si ? "start" : "end") + '">' + fmtNum(v) + "</text>";
    });
  });
  ch.labels.forEach((lab, i) => {
    s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 26) + '" font-size="12" fill="var(--muted)" text-anchor="middle">' + esc(lab) + "</text>";
  });
  s += legend(ch.series.map((ser, i) => [ser.name, i ? CHART_C2 : CHART_C1]), W, H - 6) + "</svg>";
  return s;
}
/* 饼图（甜甜圈）：扇区占比 + 名称数值标注 + 中心总额 */
function pieSvg(ch, W, H) {
  const vals = ch.series.map(s => s.values[0]);
  const total = vals.reduce((a, b) => a + b, 0);
  const cx = W / 2, cy = H / 2 - 6, r1 = Math.min(W, H) / 2 - 52, r0 = r1 * 0.58;
  const colors = [CHART_C1, CHART_C2];
  let s = svgOpen(W, H), a0 = -Math.PI / 2;
  ch.series.forEach((ser, i) => {
    const frac = vals[i] / total, a1 = a0 + frac * Math.PI * 2;
    const large = frac > .5 ? 1 : 0;
    const p0x = cx + r1 * Math.cos(a0), p0y = cy + r1 * Math.sin(a0);
    const p1x = cx + r1 * Math.cos(a1), p1y = cy + r1 * Math.sin(a1);
    const q1x = cx + r0 * Math.cos(a1), q1y = cy + r0 * Math.sin(a1);
    const q0x = cx + r0 * Math.cos(a0), q0y = cy + r0 * Math.sin(a0);
    s += '<path d="M' + p0x.toFixed(1) + " " + p0y.toFixed(1)
      + " A" + r1 + " " + r1 + " 0 " + large + " 1 " + p1x.toFixed(1) + " " + p1y.toFixed(1)
      + " L" + q1x.toFixed(1) + " " + q1y.toFixed(1)
      + " A" + r0 + " " + r0 + " 0 " + large + " 0 " + q0x.toFixed(1) + " " + q0y.toFixed(1) + ' Z" fill="'
      + colors[i % 2] + '" opacity=".88" stroke="var(--bg)" stroke-width="1.5"/>';
    const mid = (a0 + a1) / 2, lx = cx + (r1 + 14) * Math.cos(mid), ly = cy + (r1 + 14) * Math.sin(mid);
    s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" font-size="11.5" fill="var(--fg)" text-anchor="middle">'
      + esc(ser.name) + "</text>"
      + '<text x="' + lx.toFixed(1) + '" y="' + (ly + 15).toFixed(1) + '" font-size="11" fill="var(--muted)" text-anchor="middle">'
      + fmtNum(vals[i]) + (ch.unit ? " " + esc(ch.unit) : "") + " · " + (frac * 100).toFixed(1) + "%</text>";
    a0 = a1;
  });
  s += '<text x="' + cx + '" y="' + (cy - 4) + '" font-size="11" fill="var(--muted)" text-anchor="middle">合计</text>'
    + '<text x="' + cx + '" y="' + (cy + 14) + '" font-size="13.5" fill="var(--fg)" text-anchor="middle">'
    + fmtNum(total) + (ch.unit ? " " + esc(ch.unit) : "") + "</text></svg>";
  return s;
}
/* 流程框图：7 节点两行蛇形（核验/交付节点强调色描边） */
function flowSvg(ch, W) {
  const H = 128, rows = [ch.nodes.slice(0, 4), ch.nodes.slice(4)];
  const nw = 128, nh = 34, gap = 24;
  const rowX = r => (W - (rows[r].length * nw + (rows[r].length - 1) * gap)) / 2;
  let s = svgOpen(W, H);
  rows.forEach((row, r) => {
    const y0 = r ? 78 : 18;
    row.forEach((name, i) => {
      const x0 = rowX(r) + i * (nw + gap);
      const strong = /核验|批准|交付/.test(name);
      s += '<rect x="' + x0.toFixed(1) + '" y="' + y0 + '" width="' + nw + '" height="' + nh + '" rx="9" fill="'
        + (strong ? "var(--info-bg)" : "var(--surface-2)") + '" stroke="' + (strong ? "var(--info)" : "var(--border)")
        + '" stroke-width="' + (strong ? 1.6 : 1) + '"/>'
        + '<text x="' + (x0 + nw / 2).toFixed(1) + '" y="' + (y0 + nh / 2 + 5) + '" font-size="12.5" fill="var(--fg)" text-anchor="middle">'
        + (r * 4 + i + 1) + ". " + esc(name) + "</text>";
      if (i < row.length - 1) {
        const ax = x0 + nw;
        s += '<line x1="' + (ax + 3) + '" y1="' + (y0 + nh / 2) + '" x2="' + (ax + gap - 5) + '" y2="' + (y0 + nh / 2)
          + '" stroke="var(--muted)"/><path d="M' + (ax + gap - 5) + " " + (y0 + nh / 2 - 3.5)
          + " L" + (ax + gap - 1) + " " + (y0 + nh / 2) + " L" + (ax + gap - 5) + " " + (y0 + nh / 2 + 3.5)
          + ' Z" fill="var(--muted)"/>';
      }
    });
  });
  /* 行间衔接：行 1 末节点 → 行 2 首节点（L 形折线） */
  const xTail = rowX(0) + 3 * nw + gap * 2 + nw / 2, xHead = rowX(1) + nw / 2, yMid = 61;
  s += '<path d="M' + xTail.toFixed(1) + " 52 L" + xTail.toFixed(1) + " " + yMid
    + " L" + xHead.toFixed(1) + " " + yMid + " L" + xHead.toFixed(1) + " 74" + '" fill="none" stroke="var(--muted)"/>'
    + '<path d="M' + (xHead - 3.5) + " 74 L" + xHead.toFixed(1) + " 78 L" + (xHead + 3.5) + ' 74 Z" fill="var(--muted)"/></svg>';
  return s;
}
function chartFigure(ch) {
  return '<figure class="rp-chart">' + chartSvg(ch, true)
    + "<figcaption><b>" + esc(ch.id) + "</b> · " + esc(ch.title)
    + (ch.unit ? "（单位：" + esc(ch.unit) + "）" : "")
    + (ch.type === "line" ? "　<span style='color:var(--muted)'>注：两系列量纲不同，各按自身量程绘制，数值以标注为准。</span>" : "")
    + "</figcaption></figure>";
}

/* ———————————————————— 报告 paper 渲染（报告库/抽屉引用共用）———————————————————— */
/* 工件所属银行 → 快照目录名（与服务端 bankOf 一致）；未识别回退默认 */
function bankOfCompany(company) {
  const c = company || "";
  if (c.includes("招商")) return "cmb";
  if (c.includes("工商")) return "icbc";
  if (c.includes("建设")) return "ccb";
  return "cmb";
}
/* 工件对应的银行快照 manifest（多银行）：默认回退 cmb */
function manifestOf(a) {
  return state.manifests[bankOfCompany(a && a.company)] || state.manifest || {};
}
function paperHtml(a) {
  const m = manifestOf(a);
  const rows = a.metrics.map(mt => {
    const def = (m.metric_index || {})[mt.key] || {};
    const uLab = { PERCENT: "%", YUAN: "亿元" }[def.unit] || "";
    const v24 = (state.y2024s[bankOfCompany(a.company)] || state.y2024 || {})[mt.key];
    return "<tr>"
      + "<td>" + esc(def.label || mt.key) + "</td>"
      + '<td class="num">' + esc(mt.value + (mt.unit || uLab)) + "</td>"
      + '<td class="num">' + (v24 ? esc(v24 + uLab) : "—") + "</td>"
      + '<td class="delta ' + deltaDir(mt) + '">' + esc(deltaText(mt)) + "</td></tr>";
  }).join("");
  const secCharts = sid => (a.charts || []).filter(c => c.section_id === sid).map(chartFigure).join("");
  const sectionHtml = a.sections.map(sec =>

    + ((sec.claim_ids || []).length
      ? sec.claim_ids.map(id =>
        '<button class="ref-chip" onclick="openCitation(\'' + esc(id) + '\')">' + esc(id) + "</button>").join("")
      : '<span style="font-size:11.5px;color:var(--muted)">（本章为口径 / 核验 / 来源说明，不含数据论断引用）</span>')
    + "</div>").join("");
  const tocHtml = '<div class="rp-toc"><h4>目　录</h4><ol>'
    + '<li onclick="scrollToSec(\'sec-metrics\')">关键财务与监管指标</li>'

      '<li onclick="scrollToSec(\'sec-' + esc(sec.section_id) + '\')">' + esc(sec.title) + "</li>").join("")

  const entities = m.entities || [];
  const glossary = entities.map(en =>
    "<dt>" + esc((en.short_names || []).join(" / ")) + "</dt><dd>" + esc(en.full_name) + "</dd>").join("")
    + "<dt>拨备覆盖率</dt><dd>贷款损失准备余额 ÷ 不良贷款余额 × 100%</dd>"
    + "<dt>成本收入比</dt><dd>业务及管理费 ÷ 营业收入 × 100%</dd>"
    + "<dt>高级法</dt><dd>巴塞尔协议Ⅲ资本计量的高级计量方法（内部评级法等）</dd>";
  return '<article class="paper">'
    + '<div class="paper-header"><span>W06 年度报告 · 受控交付工件</span><span class="mono">' + esc(a.task_id) + "</span></div>"
    + '<div class="rp-cover">'
    + '<div class="c-company">' + esc(a.company) + "</div>"
    + '<div class="c-title">' + esc(a.report_period) + "经营简报</div>"
    + '<div class="c-meta">数据快照 ' + esc(m.snapshot_id) + "（" + esc(m.snapshot_version) + "）<br>编制于 " + esc((m.generated_at || "").replace("T", " ").replace(/Z$/, " UTC")) + "</div></div>"
    + '<div class="rp-notice"><h4>重要提示</h4><ol>'

    + "；交付批准与工件指纹 sha256 绑定。</p>"

/* 目录跳转：平滑滚动到报告章节锚点 */
function scrollToSec(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ———— 引用证据抽屉 ———— */
function openCitation(id) {
  const a = state.citeArtifact;
  const c = a && a.citations.find(x => x.claim_id === id);
  if (!c) return;
  const src = ((state.manifest || {}).sources || []).find(s => s.content_sha256 === c.source_document_digest)
    || (state.docSources || []).find(s => s.content_sha256 === c.source_document_digest);
  $("#drawer").innerHTML =
    "<h3>引用证据 · <span class=\"mono\">" + esc(c.claim_id)

/** 轻量提示浮层（右上角，3s 自动消失）。 */
function toast(msg) {
  let t = document.getElementById("__toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "__toast";
    t.style.cssText = "position:fixed;top:18px;right:20px;z-index:999;background:#222;color:#fff;padding:9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:opacity .18s;pointer-events:none;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toast._h);
  toast._h = setTimeout(() => { t.style.opacity = "0"; }, 3000);
}

let RUN_PANEL = { trace: null, view: "timeline", timer: null, openNodes: new Set() };

function fmtMs(ms) { return ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(1) + "s"; }

async function startAgentRun(bank) {
  renderRunPanelLoading();
  try {
    // 走 pipeline/run（六工位受控流水线）→ 前端组装运行轨迹（nodes 供运行面板/执行图消费）
    const resp = await jpost("/v1/pipeline/run", { bank: bank || "cmb" });
    const t = resp && resp.data ? resp.data : resp;
    if (!t || !t.stages) throw new Error((t && t.message) || "运行启动失败");
    const nodes = t.stages.map(st => ({
      id: st.stage_id, title: st.name + " · " + (st.agent || ""),
      status: "SUCCEEDED", elapsed_ms: st.elapsed_ms || 0,
      output: (st.details || []).join("；").slice(0, 300)
    }));
    RUN_PANEL.trace = {
      run_id: t.task_id, status: "SUCCEEDED",
      nodes,
      checks: t.checks, digest: t.artifact_digest
    };
    renderRunPanel();
    toast("运行 " + t.task_id + " 已完成：双核验 " + (t.checks ? t.checks.numeric.status + "/" + t.checks.citation.status : "—"));
  } catch (e) {
    renderRunPanelError(e.message);
  }
}

function renderRunPanelLoading() {
  const p = document.getElementById("run-panel");
  if (!p) return;
  p.className = "run-panel";
  p.innerHTML = '<div class="rp-live-bar"><span class="rp-dot"></span>正在启动 agent 运行…（主编规划 → 工位执行 → 门禁核验）</div>'
    + '<div class="rp-body"><div class="rp-tl">'
    + ["主编 · 任务规划", "团队与通道检查", "快照装载", "指标抽取", "经营分析", "资产质量分析", "结构化成稿", "双核验门禁", "交付判断"]
        .map((t, i) => '<div class="rp-node running" style="animation:rpPulse 1.1s ease-in-out ' + (i * 0.12) + 's infinite"><div class="rp-node-h"><span class="rp-ntype">AGENT</span><span class="rp-ntitle">' + t + '</span><span class="rp-nstatus">…</span></div></div>').join("")
    + "</div></div>";
}

function renderRunPanelError(msg) {
  const p = document.getElementById("run-panel");
  if (p) { p.className = "run-panel"; p.innerHTML = '<div class="rp-body"><div style="color:#a32d2d;font-size:12.5px">运行失败：' + esc(msg) + "</div></div>"; }
}

function renderRunPanel() {
  const p = document.getElementById("run-panel");
  const t = RUN_PANEL.trace;
  if (!p || !t) return;
  p.className = "run-panel";
  const nodes = t.nodes || [];
  const ok = nodes.filter(n => n.status === "SUCCEEDED").length;
  const st = { SUCCEEDED: ["✓", "var(--success)"], RUNNING: ["◐", "#3b7bf5"], FAILED: ["✕", "#d64545"] }[t.status] || ["?", "var(--muted)"];
  let html = '<div class="rp-head"><h3>Agent 运行 <span style="font-size:11px;color:var(--muted);font-weight:400" class="mono">' + esc(t.run_id) + " · " + esc(t.task_id) + "</span>"
    + '<span style="color:' + st[1] + ';font-size:12px">' + st[0] + " " + esc(t.status) + "</span></h3>"
    + '<div class="rp-stats">'
    + '<div class="rp-stat"><div class="v">' + nodes.length + '</div><div class="k">节点</div></div>'
    + '<div class="rp-stat"><div class="v">' + fmtMs(t.elapsed_ms || 0) + '</div><div class="k">总耗时</div></div>'
    + '<div class="rp-stat"><div class="v">' + (t.tokens || 0) + '</div><div class="k">TOKENS</div></div>'
    + '<div class="rp-stat"><div class="v">' + esc(t.cost_estimate || "—") + '</div><div class="k">成本估算</div></div>'
    + "</div></div>";
  html += '<div class="rp-toolbar"><div class="rp-view-tabs">'
    + [["timeline", "时间线"], ["graph", "执行图"], ["json", "原始"]].map(([v, l]) =>
        '<button class="rp-vtab' + (RUN_PANEL.view === v ? " on" : "") + '" onclick="setRunView(\'' + v + '\')">' + l + "</button>").join("")
    + '</div><button class="btn sm" onclick="startAgentRun(\'' + (t.bank || "cmb") + '\')">重跑</button>'
    + '<span style="font-size:10.5px;color:var(--muted);margin-left:auto">触发：' + esc(t.trigger || "—") + " · " + esc((t.started_at || "").replace("T", " ").slice(5, 19)) + "</span></div>";

  if (RUN_PANEL.view === "timeline") {
    html += '<div class="rp-body"><div class="rp-tl">' + nodes.map(n => renderTraceNode(n)).join("") + "</div></div>";
  } else if (RUN_PANEL.view === "graph") {
    html += '<div class="rp-body"><div class="rp-graph">' + renderTraceGraph(nodes) + "</div></div>";
  } else {
    html += '<div class="rp-body"><pre style="font-size:10.5px;overflow:auto">' + esc(JSON.stringify(t, null, 1)) + "</pre></div>";
  }
  p.innerHTML = html;
}

function renderTraceNode(n) {
  const cls = n.status === "FAILED" ? " failed" : (n.status === "RUNNING" ? " running" : "");
  const open = RUN_PANEL.openNodes.has(n.id);
  const stColor = n.status === "SUCCEEDED" ? "var(--success)" : (n.status === "FAILED" ? "#d64545" : "#3b7bf5");
  let body = "";
  if (open) {
    if (n.thinking) body += '<div class="rp-field"><div class="fl">思考过程 THINKING</div><div class="rp-thinking">' + esc(n.thinking) + "</div></div>";
    if (n.skill_used) body += '<div class="rp-field"><div class="fl">使用技能 SKILL</div><div class="fv">' + esc(n.skill_used) + "</div></div>";
    if ((n.tool_calls || []).length) body += '<div class="rp-field"><div class="fl">工具调用 TOOL CALLS（MCP JSON-RPC）</div>'
      + n.tool_calls.map(tc => '<div class="tc"><span class="tn">' + esc(tc.tool) + "</span><span>×" + tc.calls + '</span><span class="tp">' + esc(tc.protocol || "") + "</span></div>").join("") + "</div>";
    body += '<div class="rp-field"><div class="fl">输入 INPUT</div><div class="fv">' + esc(n.input) + "</div></div>";
    body += '<div class="rp-field"><div class="fl">输出 OUTPUT</div><div class="fv">' + esc(n.output) + "</div></div>";
    if (n.outputs_detail) body += '<div class="rp-field"><div class="fl">输出明细</div><div class="fv">' + Object.entries(n.outputs_detail).map(([k, v]) => "· " + esc(k) + ": " + esc(String(v))).join("<br>") + "</div></div>";
    if (n.gate_rule) body += '<div class="rp-field"><div class="fl">门禁规则</div><div class="fv">' + esc(n.gate_rule) + "</div></div>";
    if (n.real_check) body += '<div class="rp-field"><div class="fl">✓ 真实核验</div><div class="fv">本节点实际调用了 NumericChecker/CitationChecker（非预录数据）</div></div>';
    if (n.parallel_group) body += '<div class="rp-field"><div class="fl">并行组</div><div class="fv">' + esc(n.parallel_group) + "（与同组节点并行执行）</div></div>";
    if (n.iteration) body += '<div class="rp-field"><div class="fl">Agent Loop</div><div class="fv">iteration #' + n.iteration + "</div></div>";
  }
  return '<div class="rp-node' + cls + (open ? " open" : "") + '">'
    + '<div class="rp-node-h" onclick="toggleTraceNode(\'' + n.id + '\')">'
    + '<span class="rp-ntype ' + n.type + '">' + n.type + '</span>'
    + '<span class="rp-ntitle">' + esc(n.title) + "</span>"
    + '<span class="rp-nmeta">' + (n.tokens ? n.tokens + "tok · " : "") + fmtMs(n.elapsed_ms || 0) + '</span>'
    + '<span class="rp-nstatus" style="color:' + stColor + '">' + (n.status === "SUCCEEDED" ? "✓" : n.status) + "</span>"
    + "</div>" + (body ? '<div class="rp-node-b">' + body + "</div>" : "") + "</div>";
}

function renderTraceGraph(nodes) {
  // 聚合图：主编 → 查数 → 指标 → [双分析并行] → 写作 → 核验 → 门禁
  const par = nodes.filter(n => n.parallel_group === "analysis");
  const seq = nodes.filter(n => n.parallel_group !== "analysis");
  const arrow = '<div class="rp-garrow">↓</div>';
  let g = seq.map(n => '<div class="rp-gnode ok"><div class="gtitle">' + esc(n.title.split("·")[0].trim()) + '</div><div class="gmeta">' + n.type + " · " + fmtMs(n.elapsed_ms || 0) + "</div></div>");
  // 并行段插入到写作之前
  if (par.length) {
    const parHtml = '<div class="rp-par">' + par.map(n => '<div class="rp-gnode ok" style="width:150px"><div class="gtitle">' + esc(n.title.split("·")[0].trim()) + '</div><div class="gmeta">' + n.type + " · " + n.tokens + "tok</div></div>").join("") + "</div>";
    const wIdx = g.findIndex(x => x.includes("成稿") || x.includes("写作"));
    if (wIdx > 0) g.splice(wIdx, 0, parHtml);
  }
  return g.join(arrow);
}

function toggleTraceNode(id) {
  if (RUN_PANEL.openNodes.has(id)) RUN_PANEL.openNodes.delete(id); else RUN_PANEL.openNodes.add(id);
  renderRunPanel();
}

/** 点击技能包文件加载预览：md → 渲染；py/json → 代码块。 */
function loadSkillFile(skillId, filePath) {

/** 轻量 Markdown 渲染（标题/表格/代码块/列表/粗体，预览用，不引外部库）。 */
function renderMarkdown(md) {
  function esc2(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  const lines = String(md).split("\n");
  let out = "", inCode = false, tableBuf = [];
  const flushTable = () => {
    if (!tableBuf.length) return;
    let html = "<table>";
    tableBuf.forEach((row, ri) => {
      if (ri === 1 && /^[-\s|:]+$/.test(row)) return;
      const cells = row.split("|").map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === "") && !(idx === arr.length - 1 && c === ""));
      html += "<tr>" + cells.map(c => "<" + (ri === 0 ? "th" : "td") + ">" + esc2(c) + "</" + (ri === 0 ? "th" : "td") + ">").join("") + "</tr>";
    });
    out += html + "</table>";
    tableBuf = [];
  };
  for (const l of lines) {
    if (l.trim().startsWith("```")) { flushTable(); if (inCode) { out += "</pre>"; inCode = false; } else { out += "<pre>"; inCode = true; } continue; }
    if (inCode) { out += esc2(l) + "\n"; continue; }
    if (/^\|.*\|/.test(l.trim())) { tableBuf.push(l.trim()); continue; }
    flushTable();
    if (/^#{1,6}\s/.test(l)) { const lvl = l.match(/^#+/)[0].length; out += "<h" + Math.min(lvl+1,6) + ">" + esc2(l.replace(/^#+\s*/, "")) + "</h" + Math.min(lvl+1,6) + ">"; continue; }
    if (/^(-{3,})$/.test(l.trim())) { out += "<hr>"; continue; }
    if (/^[-*]\s/.test(l.trim())) { out += "<li>" + inlineMd(esc2(l.trim().replace(/^[-*]\s*/, ""))) + "</li>"; continue; }
    if (!l.trim()) { out += "<div style=\"height:6px\"></div>"; continue; }
    out += "<p>" + inlineMd(esc2(l)) + "</p>";
  }
  if (inCode) out += "</pre>";
  flushTable();
  function inlineMd(t) { return t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>"); }
  return out;
}
