<svg viewBox="0 0 680 720" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>上半部：用户协作层与 Go 控制层细节</title>
  <style>.ts{font:12px sans-serif;fill:#555}.th{font:14px sans-serif;font-weight:500}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style>
  <defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
  <text class="th" x="40" y="26">上半部：用户协作层 → Go 控制/事实层（协议·字段·表级细节）</text>
  <rect x="40" y="44" width="600" height="168" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="52" y="64">W02 用户协作层</text>
  <rect x="56" y="78" width="188" height="118" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="th" x="150" y="96" text-anchor="middle">WorkSwarm 对话+编排台</text>
  <text class="ts" x="66" y="118">CREATE_TASK{bank,period,材料摘要}</text>
  <text class="ts" x="66" y="134">ADOPT_GRAPH{graphDigest}·CONFIRM{artDigest}</text>
  <text class="ts" x="66" y="150">PAUSE·RESUME·REVISION{directive}</text>
  <text class="ts" x="66" y="168">看：候选图卡·节点状态·通信时间线·等待原因</text>
  <rect x="264" y="78" width="188" height="118" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="358" y="96" text-anchor="middle">Builder / 主Agent规划（LLM）</text>
  <text class="ts" x="274" y="118">输入：结构化任务+能力目录（白名单）</text>
  <text class="ts" x="274" y="134">召回→适用性→排序→选择→数据绑定</text>
  <text class="ts" x="274" y="150">输出候选图：节点[能力卡@版本]·边[依赖]</text>
  <text class="ts" x="274" y="168">反例拦截：未知能力/无界循环/缺字段→拒</text>
  <rect x="472" y="78" width="188" height="118" rx="8" fill="#CECBF6" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="566" y="96" text-anchor="middle">能力知识 #6 / ALK-05</text>
  <text class="ts" x="482" y="118">年报场景包：适用性/证据/修订</text>
  <text class="ts" x="482" y="134">选择记录：为何选此弃彼</text>
  <text class="ts" x="482" y="150">知识复用：命中/换版本/撤回</text>
  <text class="ts" x="482" y="168">铁律：知识消费必须影响图</text>
  <line x1="150" y1="196" x2="150" y2="240" class="arr" marker-end="url(#a1)"/>
  <text class="ts" x="163" y="222">①POST /v1/commands {commandId, actor, type, payload}</text>
  <rect x="40" y="240" width="600" height="464" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="52" y="260">W04 控制/事实层（Go · 唯一提交权）</text>
  <rect x="56" y="276" width="280" height="130" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="196" y="296" text-anchor="middle">命令服务</text>
  <text class="ts" x="66" y="318">幂等律：同 cmdId 同内容→原回执</text>
  <text class="ts" x="66" y="334">改内容→409 · A03/A04 · E02 伪造→拒</text>
  <text class="ts" x="66" y="350">回执：taskId·commandSeq·投影指针</text>
  <rect x="348" y="276" width="280" height="130" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="488" y="296" text-anchor="middle">图采纳服务</text>
  <text class="ts" x="358" y="318">校验链：schema→能力+版本→依赖</text>
  <text class="ts" x="358" y="334">→循环有界→预算 · 确认→冻结 T/g</text>
  <text class="ts" x="358" y="350">AR-04 版本漂移→拒绝执行</text>
  <rect x="56" y="416" width="280" height="130" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="196" y="436" text-anchor="middle">执行许可服务</text>
  <text class="ts" x="66" y="458">ready-proposal→事务校验→dispatch</text>
  <text class="ts" x="66" y="474">lease+fencing epoch · effect token</text>
  <text class="ts" x="66" y="490">先查重复再查代次（S09 教训）</text>
  <rect x="348" y="416" width="280" height="130" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="488" y="436" text-anchor="middle">结果/审计</text>
  <text class="ts" x="358" y="458">o=(T,g,node_path,iteration_path) 唯一</text>
  <text class="ts" x="358" y="474">同输入重交→复用 · 改内容→冲突</text>
  <text class="ts" x="358" y="490">无结果≠重发 · 审计失败→传播</text>
  <rect x="56" y="556" width="280" height="136" rx="8" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="196" y="576" text-anchor="middle">PostgreSQL 权威账本</text>
  <text class="ts" x="66" y="598">graph_revisions · node_attempts</text>
  <text class="ts" x="66" y="614">committed_results · outbox · audit_log</text>
  <text class="ts" x="66" y="630">checks（W06 结论+digest）</text>
  <text class="ts" x="66" y="646">approvals（具名批准+同 digest）</text>
  <rect x="348" y="556" width="280" height="136" rx="8" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="488" y="576" text-anchor="middle">交付谓词（Go 判定）</text>
  <text class="ts" x="358" y="598">Deliverable ⟺ numeric.PASSED</text>
  <text class="ts" x="358" y="614">∧ citation.PASSED ∧ user.CONFIRMED</text>
  <text class="ts" x="358" y="630">∧ 三记录绑定同一 artifact_sha256</text>
  <text class="ts" x="358" y="646">W06 N3 缺口=谓词拼不上处</text>
</svg>