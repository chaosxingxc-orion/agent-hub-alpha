{
  "services": {
    "credit": {
      "image": "${H03_IMAGE_CREDIT:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "CREDIT_ADDR": ":8091",
        "CREDIT_DATA": "/data",
        "CREDIT_ORCHESTRATOR_URL": "http://orchestrator:8195",
        "CREDIT_MEMBER_MCP_URL": "http://credit:8091/member-mcp",
        "CREDIT_MODEL": "engineering-no-model",
        "CREDIT_BUS_TENANT": "h03-engineering",
        "CREDIT_RDC_URL": "http://rdc:8092",
        "RDC_REGISTRY_API_TOKEN": "${H03_REGISTRY_TOKEN:?required}",
        "CREDIT_DEMO_PASSWORD": "${H03_LOGIN_PASSWORD:?required}",
        "CREDIT_SCENARIO_DIR": "/h03/scenarios",
        "H03_PROFILE_ENABLED": "1",
        "H03_PROFILE_CONFIG": "/h03/engineering-profile.json",
        "H03_PROFILE_SHA256": "${H03_PROFILE_SHA256:?required}",
        "H03_RUNTIME_CREDENTIAL": "${H03_RUNTIME_CREDENTIAL:?required}"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "credit-data",
          "target": "/data"
        },
        {
          "type": "bind",
          "source": "${H03_CONFIG:?required}",
          "target": "/h03",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "ports": [
        {
          "target": 8091,
          "published": "18191",
          "host_ip": "127.0.0.1",
          "protocol": "tcp"
        }
      ]
    },
    "orchestrator": {
      "image": "${H03_IMAGE_ORCHESTRATOR:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "CREDIT_URL": "http://credit:8091",
        "WORKER_NAME": "h03-owned-runtime",
        "MODEL_NAME": "engineering-no-model",
        "CREDIT_BUS_GATEWAY": "http://gateway:8080",
        "CREDIT_BUS_TOKEN": "${H03_GATEWAY_TOKEN:?required}",
        "H03_RUNTIME_CREDENTIAL": "${H03_RUNTIME_CREDENTIAL:?required}"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "depends_on": [
        "credit"
      ]
    },
    "engineering-sum": {
      "image": "${H03_IMAGE_ENGINEERING_SUM:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "CREDIT_URL": "http://credit:8091",
        "AGENT_SERVICE_ID": "h03-engineering-sum",
        "AGENT_ROLE": "engineering-sum",
        "AGENT_PUBLIC_URL": "http://engineering-sum:8090",
        "OPENJIUWEN_SERVICE_VERSION": "0.1.0",
        "H03_ENGINEERING_ROLE": "sum"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "depends_on": [
        "credit"
      ]
    },
    "engineering-reconcile": {
      "image": "${H03_IMAGE_ENGINEERING_RECONCILE:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "CREDIT_URL": "http://credit:8091",
        "AGENT_SERVICE_ID": "h03-engineering-reconcile",
        "AGENT_ROLE": "engineering-reconcile",
        "AGENT_PUBLIC_URL": "http://engineering-reconcile:8090",
        "OPENJIUWEN_SERVICE_VERSION": "0.1.0",
        "H03_ENGINEERING_ROLE": "reconcile"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "depends_on": [
        "credit"
      ]
    },
    "bus-db": {
      "image": "${H03_IMAGE_BUS_DB:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "POSTGRES_DB": "agent_rdc",
        "POSTGRES_USER": "agent_rdc",
        "POSTGRES_PASSWORD": "${H03_DB_PASSWORD:?required}"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "rdc-data",
          "target": "/var/lib/postgresql/data"
        }
      ],
      "user": "70:70"
    },
    "rdc": {
      "image": "${H03_IMAGE_RDC:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "SPRING_APPLICATION_JSON": "{\"openjiuwen\":{\"registry\":{\"auth\":{\"adapter\":\"static-token\",\"token\":\"${H03_REGISTRY_TOKEN:?required}\"},\"registration-paths\":[\"reconciliation\"],\"route-handle-secret\":\"${H03_ROUTE_SECRET:?required}\"}},\"rdc\":{\"deployment-discovery\":{\"binding-defaults\":{\"card-path\":\"/.well-known/agent-card.json\",\"contract-version\":\"1.0\",\"framework-type\":\"JIUWEN\",\"max-concurrency\":3,\"route-key\":\"/a2a/jsonrpc/\"},\"enabled\":true,\"instances\":[{\"base-url\":\"http://engineering-sum:8090\",\"capability-version\":\"0.1.0\",\"contract-version\":\"1.0\",\"deployment-version\":\"h03-engineering-v1\",\"instance-id\":\"h03-sum-1\",\"readiness\":\"READY\",\"route-key\":\"/a2a/jsonrpc/\",\"service-id\":\"h03-engineering-sum\",\"tenant-id\":\"h03-engineering\",\"version-source\":\"deployment-binding\"},{\"base-url\":\"http://engineering-reconcile:8090\",\"capability-version\":\"0.1.0\",\"contract-version\":\"1.0\",\"deployment-version\":\"h03-engineering-v1\",\"instance-id\":\"h03-reconcile-1\",\"readiness\":\"READY\",\"route-key\":\"/a2a/jsonrpc/\",\"service-id\":\"h03-engineering-reconcile\",\"tenant-id\":\"h03-engineering\",\"version-source\":\"deployment-binding\"}],\"reconcile-interval\":\"5s\"},\"registry\":{\"card-fetch\":{\"target-cidrs\":[\"10.253.251.0/24\"],\"verify-signatures\":false}}},\"server\":{\"address\":\"0.0.0.0\",\"port\":8092},\"spring\":{\"datasource\":{\"password\":\"${H03_DB_PASSWORD:?required}\",\"url\":\"jdbc:postgresql://bus-db:5432/agent_rdc\",\"username\":\"agent_rdc\"},\"flyway\":{\"enabled\":true}}}"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "depends_on": [
        "bus-db"
      ]
    },
    "gateway": {
      "image": "${H03_IMAGE_GATEWAY:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "SERVER_ADDRESS": "0.0.0.0",
        "SERVER_PORT": "8080",
        "GATEWAY_PATH_MODE": "direct",
        "GATEWAY_RUNTIME_A2A_PROTOCOL_VERSION": "1.0",
        "GATEWAY_RDC_V2_BASE_URL": "http://rdc:8092",
        "GATEWAY_RDC_TOKEN": "${H03_REGISTRY_TOKEN:?required}",
        "GATEWAY_RDC_TENANT_ID": "h03-engineering",
        "GATEWAY_TEST_CREDENTIAL_TOKEN": "${H03_GATEWAY_TOKEN:?required}",
        "GATEWAY_TEST_CREDENTIAL_PRINCIPALID": "h03-owned-runtime",
        "GATEWAY_TEST_CREDENTIAL_TENANTID": "h03-engineering"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "depends_on": [
        "rdc"
      ]
    },
    "swarm": {
      "image": "${H03_IMAGE_SWARM:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {
        "FRONTEND_HOST": "0.0.0.0",
        "CREDIT_MCP_URL": "http://credit:8091/mcp",
        "CREDIT_INTERNAL_URL": "http://credit:8091"
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "swarm-data",
          "target": "/root/.jiuwenswarm"
        },
        {
          "type": "bind",
          "source": "${H03_PLUGIN:?required}",
          "target": "/root/.jiuwenswarm/domain/application_plugins/credit-workbench",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "depends_on": [
        "credit"
      ]
    },
    "front": {
      "image": "${H03_IMAGE_FRONT:?required}",
      "restart": "no",
      "networks": [
        "h03"
      ],
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      },
      "environment": {},
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${H03_FRONT:?required}",
          "target": "/etc/nginx/conf.d/default.conf",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "ports": [
        {
          "target": 80,
          "published": "18192",
          "host_ip": "127.0.0.1",
          "protocol": "tcp"
        }
      ],
      "depends_on": [
        "swarm"
      ]
    }
  },
  "networks": {
    "h03": {
      "internal": true,
      "ipam": {
        "config": [
          {
            "subnet": "10.253.251.0/24"
          }
        ]
      },
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      }
    }
  },
  "volumes": {
    "credit-data": {
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      }
    },
    "rdc-data": {
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      }
    },
    "swarm-data": {
      "labels": {
        "io.agent-hub.h03.owner": "${H03_OWNER:?required}"
      }
    }
  }
}
